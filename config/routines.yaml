# Which collectors to run, and default distillation parameters.

collectors:
  - arxiv
  - hf_papers
  - lab_blogs        # reads sources.yaml: hardware.rss + releases.rss
  - github_trending  # reads sources.yaml: releases.github_topics (hot repos -> releases)
  - hf_trending      # HF trending models + datasets (-> releases)

distill:
  window: 48h        # 24h daily / 48h default / 7d weekly
  max_items: 10       # main list cap
  focus: []
  market: off        # on => append mechanism-mapping to score>=4 items (NOT advice)
  include_threshold: 2   # score >= this -> main list; ==1 -> watch-list; <=0 drop

deliver:                 # optional email push of the digest (distill/deliver.py).
  email: false           # true (or set RADAR_EMAIL_TO env) to send. Needs SMTP_* secrets.
  # Env: RADAR_EMAIL_TO, RADAR_SMTP_HOST/USER/PASS (+ optional PORT/FROM). No-op if unset.

agent:               # optional enrichment pass (RADAR_AGENT=on). Deterministic fetches +
  enabled: false     #   one model call per item. off => pipeline runs exactly as before.
  top_n: 8           # enrich the top-N scored items (match distill.max_items: shown == enriched)
  budget: 10         # hard ceiling on model calls per run (8 briefs + margin)
  sleep_between: 5   # seconds between model calls (rate-limit breathing room)
  # Models (GitHub Models, free): synthesis uses RADAR_GITHUB_MODEL (default gpt-4.1, strong);
  # briefs use BRIEF_GITHUB_MODEL (default gpt-4.1-mini, cheaper daily quota).
