# Which collectors to run, and default distillation parameters.

collectors:
  - arxiv
  - hf_papers
  - lab_blogs        # reads sources.yaml: hardware.rss + releases.rss

distill:
  window: 48h        # 24h daily / 48h default / 7d weekly
  max_items: 8       # main list cap
  focus: []          # re-rank boost, e.g. [interpretability, agents, evals]
  market: off        # on => append mechanism-mapping to score>=4 items (NOT advice)
  include_threshold: 3   # score >= this -> main list; ==2 -> watch-list; <=1 drop

agent:               # optional enrichment pass (RADAR_AGENT=on). Deterministic fetches +
  enabled: false     #   one model call per item. off => pipeline runs exactly as before.
  top_n: 5           # enrich the top-N scored items
  budget: 8          # hard ceiling on model calls per run (free-tier safety)
  sleep_between: 5   # seconds between model calls (rate-limit breathing room)
