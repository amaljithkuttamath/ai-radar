[project]
name = "ai-radar"
version = "0.1.0"
description = "Collect, score, and distill a daily AI research/hardware/releases digest."
requires-python = ">=3.10"
# Core collection + scoring is stdlib-only. These cover RSS + config + the API synthesis path.
dependencies = [
    "pyyaml>=6.0",
    "feedparser>=6.0",
]

[dependency-groups]
# Tests only. The pipeline itself stays stdlib + pyyaml + feedparser, so CI's collect and
# distill jobs never install this group.
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
# Run collectors/distill with: uv run python -m collectors.arxiv  (etc.)
# or the whole cycle: uv run bash scripts/run.sh
# Tests: uv run --group dev pytest
