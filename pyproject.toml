[project]
name = "ai-radar"
version = "0.2.0"
description = "Collect AI source observations and publish evidence-grounded daily digests."
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0", "feedparser>=6.0"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/test_check_whitelist.py" = ["E402"]
