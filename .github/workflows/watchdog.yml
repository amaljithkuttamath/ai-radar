name: watchdog

# Watches the watcher.
#
# On 2026-07-13 the eval loop stopped and nobody noticed for six days. The
# reason it went unnoticed is structural: the grader is an external scheduled
# task (ADR-0003 — deliberately out-of-repo so a distill bug can't suppress its
# own criticism), so it appears in no workflow run list, no repo file, and no
# local scheduler. Nothing in this repo could observe its absence.
#
# Note what does NOT detect this: a heartbeat on distill. Throughout that same
# six-day window collect-corpus and distill succeeded daily and committed a
# digest every morning. The pipeline was healthy while its supervisor was dead.
# A success-ping on a healthy component cannot detect a failed independent one.
#
# So this job checks the ARTIFACT, not the process: how old is evals/latest.json?
# Staleness is the one signal that is true regardless of why the grader stopped
# — task deleted, token expired, silent error, or provider outage.

on:
  schedule:
    - cron: "0 15 * * *"    # 15:00 UTC — 3h after the grader's 12:00 UTC slot
  workflow_dispatch:

permissions:
  contents: read
  issues: write             # opens one staleness issue; never writes code

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  eval-freshness:
    runs-on: ubuntu-latest
    env:
      # The grader runs daily. 48h tolerates one missed run (provider blip,
      # GitHub delay) without crying wolf, and catches a genuine stop on day two.
      MAX_AGE_HOURS: 48
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0    # need commit times, not just file contents

      # Commit time, not a timestamp inside the file: a grader that writes a
      # stale-but-well-formed artifact, or one that dies mid-write, can leave
      # the JSON's own `date` field looking current. git's commit time is the
      # one clock the grader does not author.
      - name: Check evals/latest.json freshness
        id: check
        run: |
          set -euo pipefail

          if [ ! -f evals/latest.json ]; then
            echo "stale=true"                     >> "$GITHUB_OUTPUT"
            echo "reason=evals/latest.json is missing entirely" >> "$GITHUB_OUTPUT"
            echo "age_h=n/a"                      >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_EPOCH=$(git log -1 --format=%ct -- evals/latest.json)
          if [ -z "$LAST_EPOCH" ]; then
            echo "stale=true"                     >> "$GITHUB_OUTPUT"
            echo "reason=no commit history for evals/latest.json" >> "$GITHUB_OUTPUT"
            echo "age_h=n/a"                      >> "$GITHUB_OUTPUT"
            exit 0
          fi

          AGE_H=$(( ( $(date -u +%s) - LAST_EPOCH ) / 3600 ))
          echo "Last eval commit: $(date -u -d "@$LAST_EPOCH" '+%Y-%m-%d %H:%M UTC')"
          echo "Age: ${AGE_H}h (threshold ${MAX_AGE_HOURS}h)"
          echo "age_h=${AGE_H}" >> "$GITHUB_OUTPUT"

          if [ "$AGE_H" -gt "$MAX_AGE_HOURS" ]; then
            echo "stale=true"  >> "$GITHUB_OUTPUT"
            echo "reason=last eval committed ${AGE_H}h ago" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      # One open issue at a time. A watchdog that files daily trains you to
      # ignore it, which reproduces the original failure by a different route.
      - name: Open staleness issue
        if: steps.check.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REASON: ${{ steps.check.outputs.reason }}
          AGE_H: ${{ steps.check.outputs.age_h }}
        run: |
          set -euo pipefail
          EXISTING=$(gh issue list --label watchdog --state open \
                       --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Issue #${EXISTING} already open; not filing a duplicate."
            exit 0
          fi
          # Body lives in a committed file, not inline: markdown emphasis and
          # list markers collide with YAML syntax inside a run block, and a
          # reviewable file beats an escaped heredoc. REASON is generated by the
          # step above (never user input), so sed substitution is safe here.
          sed "s|__REASON__|${REASON}|" .github/watchdog-issue-body.md > /tmp/watchdog-body.md
          gh issue create \
            --title "[watchdog] eval loop appears stopped (${AGE_H}h since last eval)" \
            --label watchdog \
            --body-file /tmp/watchdog-body.md

      # Fail the run too, so it shows red in the Actions tab even if issue
      # notifications are muted. Two independent surfaces for one signal.
      - name: Fail on staleness
        if: steps.check.outputs.stale == 'true'
        run: |
          echo "::error::Eval loop stale: ${{ steps.check.outputs.reason }}"
          exit 1
