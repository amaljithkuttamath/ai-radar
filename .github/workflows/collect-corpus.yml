name: collect-corpus

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      window:
        description: "Lookback window (24h, 48h, 7d; maximum 31d)"
        default: "48h"
        type: string

permissions:
  contents: write

concurrency:
  group: collect-corpus
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WINDOW: ${{ inputs.window || '48h' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: Install locked runtime
        run: uv sync --locked --no-dev
      - name: Collect and record source health
        run: uv run --no-sync python -m radar collect
      - name: Retain corpus and its collection manifest
        uses: actions/upload-artifact@v4
        with:
          name: corpus-raw
          path: |
            data/raw/
            data/collection.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain collection diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: collection-failure
          path: data/collection.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit observation ledger
        run: bash scripts/publish.sh collect
