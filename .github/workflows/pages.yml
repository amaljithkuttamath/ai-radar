name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      # The canonical reader lives in the personal site; keep old links working.
      # Ship only runtime assets, never development dependencies or tests.
      - name: Stage redirect assets
        run: |
          mkdir -p "$RUNNER_TEMP/radar-site"
          cp site/index.html site/redirect.mjs "$RUNNER_TEMP/radar-site/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/radar-site
      - name: Deploy redirect
        id: deploy
        uses: actions/deploy-pages@v4
