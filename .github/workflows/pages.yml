name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      # No package install is needed to serve the pinned browser bundles.
      # Ship only runtime assets, never development dependencies or tests.
      - name: Stage reader assets
        run: |
          mkdir -p "$RUNNER_TEMP/radar-site"
          cp site/index.html site/styles.css site/app.js site/boot.js site/radar.svg "$RUNNER_TEMP/radar-site/"
          cp -R site/vendor "$RUNNER_TEMP/radar-site/vendor"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/radar-site
      - name: Deploy reader
        id: deploy
        uses: actions/deploy-pages@v4
