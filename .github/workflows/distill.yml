name: distill

on:
  workflow_run:
    workflows: [collect-corpus]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      corpus_run_id:
        description: "Successful collect run ID (blank = latest successful main run)"
        type: string
      window:
        description: "Lookback window"
        default: "48h"
        type: string
      backend:
        description: "Model synthesis or unpublished preview"
        type: choice
        default: auto
        options: [auto, openai, anthropic, dryrun, template]
      radar_agent:
        description: "Optional per-item model enrichment"
        type: choice
        default: "off"
        options: ["off", "on"]
      focus_backend:
        description: "Interest matching"
        type: choice
        default: lexical
        options: [lexical, embed]
      deliver_email:
        description: "Send after publication (requires SMTP secrets)"
        type: choice
        default: "off"
        options: ["off", "on"]

permissions:
  contents: write
  actions: read

concurrency:
  group: distill
  cancel-in-progress: false

jobs:
  distill:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WINDOW: ${{ inputs.window || '48h' }}
      RADAR_MODEL_BACKEND: ${{ inputs.backend || 'auto' }}
      RADAR_AGENT: ${{ inputs.radar_agent || 'off' }}
      FOCUS_BACKEND: ${{ inputs.focus_backend || 'lexical' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RADAR_LLM_API_KEY: ${{ secrets.RADAR_LLM_API_KEY }}
      RADAR_LLM_BASE_URL: ${{ vars.RADAR_LLM_BASE_URL }}
      RADAR_SYNTHESIS_MODEL: ${{ vars.RADAR_SYNTHESIS_MODEL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: Install locked runtime
        run: uv sync --locked --no-dev
      - name: Resolve a successful collection run
        id: corpus
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_RUN: ${{ inputs.corpus_run_id }}
          TRIGGER_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          run_id="${TRIGGER_RUN:-${REQUESTED_RUN:-}}"
          if [ -z "$run_id" ]; then
            run_id=$(gh run list --workflow collect-corpus.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          fi
          if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
            echo "No valid corpus run ID. Run collect-corpus first." >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > /tmp/radar-corpus-run.json
          python - <<'PY'
          import json
          run = json.load(open('/tmp/radar-corpus-run.json'))
          if (run['conclusion'] != 'success' or run['head_branch'] != 'main'
                  or run['path'] != '.github/workflows/collect-corpus.yml'
                  or run['head_repository']['full_name'] != run['repository']['full_name']):
              raise SystemExit('Requested run is not a trusted successful main collection')
          PY
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download corpus and manifest
        uses: actions/download-artifact@v4
        with:
          name: corpus-raw
          path: data/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.corpus.outputs.run_id }}
      - name: Require collection manifest
        run: test -s data/collection.json
      - name: Distill and validate
        run: uv run --no-sync python -m radar distill
      - name: Retain previews and replay cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/previews/
            data/evolution/cases/
          if-no-files-found: ignore
          retention-days: 30
      - name: Commit validated publication
        if: env.RADAR_MODEL_BACKEND != 'dryrun' && env.RADAR_MODEL_BACKEND != 'template'
        run: bash scripts/publish.sh distill
      - name: Deliver explicitly requested email
        if: inputs.deliver_email == 'on' && env.RADAR_MODEL_BACKEND != 'dryrun' && env.RADAR_MODEL_BACKEND != 'template'
        env:
          RADAR_EMAIL_TO: ${{ secrets.RADAR_EMAIL_TO }}
          RADAR_EMAIL_FROM: ${{ secrets.RADAR_EMAIL_FROM }}
          RADAR_SMTP_HOST: ${{ secrets.RADAR_SMTP_HOST }}
          RADAR_SMTP_PORT: ${{ secrets.RADAR_SMTP_PORT }}
          RADAR_SMTP_USER: ${{ secrets.RADAR_SMTP_USER }}
          RADAR_SMTP_PASS: ${{ secrets.RADAR_SMTP_PASS }}
        run: uv run --no-sync python -m distill.deliver
      - name: Heartbeat after successful publication
        if: success() && env.RADAR_MODEL_BACKEND != 'dryrun' && env.RADAR_MODEL_BACKEND != 'template'
        env:
          PING_URL: ${{ secrets.RADAR_HC_PING_URL }}
        run: |
          if [ -n "$PING_URL" ]; then
            curl -fsS -m 10 --retry 3 "$PING_URL"
          fi
