name: guard

# The repo's first pull_request-triggered workflow. Until this existed, no
# workflow observed PRs at all (collect-corpus is schedule, distill is
# workflow_run, radar is dispatch), so a bot PR reached the merge button having
# passed exactly zero automated checks.
#
# Two jobs, both cheap and both deterministic:
#   whitelist — does this PR stay inside the author's declared write scope?
#   tests     — does the harness itself still work?
#
# Deliberately NOT a quality gate on the digest. This checks bounds and
# mechanism, not editorial output; the grader owns that and runs elsewhere
# (ADR-0003), so a bug here cannot suppress its own criticism.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read          # read-only: this job judges PRs, it must never write

concurrency:
  group: guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  whitelist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0        # need the merge base to diff against

      # Role is derived from the PR AUTHOR, not the branch name.
      #
      # An earlier draft inferred it from the branch prefix (improve/* -> coder).
      # That is a control an agent can step around by naming its branch
      # something else, which makes it an instruction rather than a fence — the
      # exact class this harness exists to replace. Branch names are agent-
      # chosen; the authenticated identity on the PR is not.
      #
      # Bot identities are the closed set of accounts that can open agent PRs.
      # Anything else is a human, who widens the fence by review (CODEOWNERS).
      - name: Determine role
        id: role
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$PR_AUTHOR" in
            radar-improve-bot|radar-improve-bot\[bot\])
              ROLE=coder ;;
            radar-eval-bot|radar-eval-bot\[bot\])
              ROLE=grader ;;
            *)
              ROLE=human ;;
          esac

          # Defence in depth: a human PR carrying an agent branch prefix is
          # either a human testing agent behaviour or an agent authenticating as
          # a human. Either way, apply the stricter scope rather than skipping.
          if [ "$ROLE" = "human" ]; then
            case "$HEAD_REF" in
              improve/*) ROLE=coder  ; echo "::notice::Agent branch prefix on a human-authored PR; applying coder scope." ;;
              evals/*)   ROLE=grader ; echo "::notice::Agent branch prefix on a human-authored PR; applying grader scope." ;;
            esac
          fi

          echo "PR author: $PR_AUTHOR -> role: $ROLE"
          echo "role=$ROLE" >> "$GITHUB_OUTPUT"

      - name: Check changed paths against whitelist
        if: steps.role.outputs.role != 'human'
        run: |
          git diff --name-only \
            "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
            | python3 scripts/check_whitelist.py --role "${{ steps.role.outputs.role }}"

      # A human PR still gets the fence reported, so widening agent scope is
      # visible in the check output rather than buried in the diff.
      - name: Report scope (human PR, informational)
        if: steps.role.outputs.role == 'human'
        run: |
          echo "Human-authored PR: whitelist scope check skipped."
          if git diff --name-only \
               "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
               | grep -qE '^(\.github/|docs/operating/|scripts/check_whitelist\.py)'; then
            echo "::warning::This PR modifies fence configuration (workflows, agent"\
                 "contracts, or the enforcer). Confirm the change is intended."
          fi

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Run harness tests
        run: uv run --with pytest pytest tests/ -q
