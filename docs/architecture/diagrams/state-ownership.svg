<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <style>
      .lbl { font-size: 11px; font-weight: 700; letter-spacing: 1px; fill: #6b7280; }
      .box { fill: #ffffff; stroke: #111827; stroke-width: 1.5; }
      .b1 { fill: #f0f9ff; stroke: #0369a1; }
      .b2 { fill: #fef3c7; stroke: #b45309; }
      .b3 { fill: #f3e8ff; stroke: #7e22ce; }
      .b4 { fill: #dcfce7; stroke: #15803d; }
      .t  { font-size: 13px; font-weight: 700; fill: #111827; }
      .s  { font-size: 10.5px; fill: #4b5563; }
      .n  { font-size: 10px; fill: #6b7280; font-style: italic; }
      .arr { stroke: #4b5563; stroke-width: 1.4; fill: none; }
      .ro  { stroke: #0ea5e9; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; }
      .rw  { stroke: #b45309; stroke-width: 1.6; fill: none; }
      .path { fill: #f9fafb; stroke: #d1d5db; stroke-dasharray: 3 2; }
    </style>
  </defs>

  <text x="450" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">State ownership matrix</text>
  <text x="450" y="42" text-anchor="middle" class="s">who writes what. read paths in cyan, write paths in amber.</text>

  <!-- Writer columns -->
  <text x="130" y="80" text-anchor="middle" class="lbl">COLLECT</text>
  <rect x="40" y="90" width="180" height="60" rx="6" class="box b1"/>
  <text x="130" y="112" text-anchor="middle" class="t">collect-corpus.yml</text>
  <text x="130" y="132" text-anchor="middle" class="s">GH Actions, 11:00 UTC</text>

  <text x="360" y="80" text-anchor="middle" class="lbl">DISTILL</text>
  <rect x="270" y="90" width="180" height="60" rx="6" class="box b2"/>
  <text x="360" y="112" text-anchor="middle" class="t">distill.yml</text>
  <text x="360" y="132" text-anchor="middle" class="s">reactive on collect</text>

  <text x="590" y="80" text-anchor="middle" class="lbl">EVAL</text>
  <rect x="500" y="90" width="180" height="60" rx="6" class="box b3"/>
  <text x="590" y="112" text-anchor="middle" class="t">daily grader</text>
  <text x="590" y="132" text-anchor="middle" class="s">Perplexity, 12:00 UTC</text>

  <text x="820" y="80" text-anchor="middle" class="lbl">PRESENT</text>
  <rect x="730" y="90" width="140" height="60" rx="6" class="box b4"/>
  <text x="800" y="112" text-anchor="middle" class="t">radar.astro</text>
  <text x="800" y="132" text-anchor="middle" class="s">read-only</text>

  <!-- State rows -->
  <g>
    <rect x="40" y="200" width="160" height="46" rx="4" class="path"/>
    <text x="120" y="220" text-anchor="middle" class="t" font-size="11.5">data/raw/**</text>
    <text x="120" y="236" text-anchor="middle" class="n">artifact only</text>
    <path d="M130,150 L130,200" class="rw" marker-end="url(#arr)"/>
  </g>

  <g>
    <rect x="40" y="266" width="160" height="46" rx="4" class="path"/>
    <text x="120" y="286" text-anchor="middle" class="t" font-size="11.5">data/seen.json</text>
    <text x="120" y="302" text-anchor="middle" class="n">dedup ledger</text>
    <path d="M130,150 C130,180 120,240 120,266" class="rw" marker-end="url(#arr)"/>
  </g>

  <g>
    <rect x="270" y="200" width="180" height="46" rx="4" class="path"/>
    <text x="360" y="220" text-anchor="middle" class="t" font-size="11.5">reports/YYYY-MM-DD.md</text>
    <text x="360" y="236" text-anchor="middle" class="n">dated digest</text>
    <path d="M360,150 L360,200" class="rw" marker-end="url(#arr)"/>
    <!-- eval reads it -->
    <path d="M450,222 L500,180" class="ro" marker-end="url(#arr)"/>
    <!-- present reads it -->
    <path d="M450,220 C560,220 700,180 730,140" class="ro" marker-end="url(#arr)"/>
  </g>

  <g>
    <rect x="270" y="266" width="180" height="46" rx="4" class="path"/>
    <text x="360" y="286" text-anchor="middle" class="t" font-size="11.5">reports/latest.md</text>
    <text x="360" y="302" text-anchor="middle" class="n">pointer (regenerated)</text>
    <path d="M360,150 C360,190 350,240 350,266" class="rw" marker-end="url(#arr)"/>
    <path d="M450,288 C560,288 700,150 730,140" class="ro" marker-end="url(#arr)"/>
  </g>

  <g>
    <rect x="270" y="332" width="180" height="46" rx="4" class="path"/>
    <text x="360" y="352" text-anchor="middle" class="t" font-size="11.5">data/state.json</text>
    <text x="360" y="368" text-anchor="middle" class="n">movers snapshot</text>
    <path d="M360,150 C360,220 380,300 380,332" class="rw" marker-end="url(#arr)"/>
    <path d="M450,352 C560,352 700,150 730,140" class="ro" marker-end="url(#arr)"/>
  </g>

  <g>
    <rect x="500" y="200" width="180" height="46" rx="4" class="path"/>
    <text x="590" y="220" text-anchor="middle" class="t" font-size="11.5">evals/YYYY-MM-DD.json</text>
    <text x="590" y="236" text-anchor="middle" class="n">rubric scores</text>
    <path d="M590,150 L590,200" class="rw" marker-end="url(#arr)"/>
  </g>

  <g>
    <rect x="500" y="266" width="180" height="46" rx="4" class="path"/>
    <text x="590" y="286" text-anchor="middle" class="t" font-size="11.5">evals/latest.json</text>
    <text x="590" y="302" text-anchor="middle" class="n">pointer (regenerated)</text>
    <path d="M590,150 C590,190 580,240 580,266" class="rw" marker-end="url(#arr)"/>
    <path d="M680,288 C700,288 720,180 750,150" class="ro" marker-end="url(#arr)"/>
  </g>

  <g>
    <rect x="500" y="332" width="180" height="46" rx="4" class="path"/>
    <text x="590" y="352" text-anchor="middle" class="t" font-size="11.5">evals/backlog.md</text>
    <text x="590" y="368" text-anchor="middle" class="n">append-only queue</text>
    <path d="M590,150 C590,220 610,310 610,332" class="rw" marker-end="url(#arr)"/>
  </g>

  <!-- Legend -->
  <g transform="translate(40, 420)">
    <text x="0" y="0" class="lbl">LEGEND</text>
    <line x1="0" y1="14" x2="30" y2="14" class="rw" marker-end="url(#arr)"/>
    <text x="38" y="18" class="s">write (owner)</text>
    <line x1="180" y1="14" x2="210" y2="14" class="ro" marker-end="url(#arr)"/>
    <text x="218" y="18" class="s">read (consumer)</text>
    <rect x="360" y="6" width="18" height="14" class="path"/>
    <text x="382" y="18" class="s">durable state</text>
  </g>

  <!-- Rule -->
  <text x="450" y="454" text-anchor="middle" class="n">Rule: every state has exactly one writer. Concurrent runs cannot collide by construction.</text>
</svg>
